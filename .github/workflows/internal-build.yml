name: Internal native builds / exact TestFlight upload

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native build platform, or explicit upload-only of an existing verified IPA
        type: choice
        options: [both, android, ios, testflight-upload]
        default: both
        required: true
      build_number:
        description: Diagnostic build number, 1-9999; NOT a reserved store number
        type: string
        default: '1'
        required: true
      android_signing:
        description: Android signing (upload-key requires approved secrets; never uploads)
        type: choice
        options: [unsigned, upload-key]
        default: unsigned
        required: true
      ios_runner:
        description: Standard macOS 26 host (both use Xcode 26.6)
        type: choice
        options: [macos-26-intel, macos-26]
        default: macos-26-intel
        required: true
      ios_signing:
        description: iOS signing (TestFlight internal only; requires platform=ios; never uploads)
        type: choice
        options: [unsigned, testflight]
        default: unsigned
        required: true
      source_run_id:
        description: Upload-only — successful signed-iOS source run ID
        type: string
        default: ''
      source_sha:
        description: Upload-only — approved full source commit SHA
        type: string
        default: ''
      artifact_id:
        description: Upload-only — exact signed-iOS artifact ID
        type: string
        default: ''
      ipa_sha256:
        description: Upload-only — independently reviewed exact IPA SHA-256
        type: string
        default: ''
      confirm_internal_only:
        description: Upload-only — authorize one TestFlight INTERNAL upload, never public submission
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: internal-build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_BC_PREVIEW: '0'
  BC_INTERNAL_BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  source:
    if: inputs.platform != 'testflight-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      compatibility: ${{ steps.compatibility.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m unittest discover -s scripts/internal-build -p 'test_*.py'
      - name: Require iOS-only selection for TestFlight signing
        env:
          BC_IOS_SIGNING: ${{ inputs.ios_signing || 'unsigned' }}
          BC_BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          case "$BC_IOS_SIGNING" in
            unsigned) ;;
            testflight) test "$BC_BUILD_PLATFORM" = ios ;;
            *) exit 1 ;;
          esac
      - run: npm ci
      - run: npm run check
      - name: Check Expo compatibility (reported by separate hard gate)
        id: compatibility
        continue-on-error: true
        run: |
          mkdir -p build/compatibility
          set -o pipefail
          npx --no-install expo install --check 2>&1 | tee build/compatibility/expo-check.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expo-compatibility-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compatibility/expo-check.txt
          if-no-files-found: error
          retention-days: 7
      - name: Validate resolved identity and build numbers
        run: |
          mkdir -p build
          npx --no-install expo config --type public --json > build/expo-config.json
          python3 scripts/internal-build/validate.py config build/expo-config.json
      - name: Reject invalid build numbers
        run: |
          for invalid in 0 01 10000 -1 1.2 invalid; do
            if BC_INTERNAL_BUILD_NUMBER="$invalid" npx --no-install expo config --json >/dev/null 2>&1; then
              echo 'Invalid build number was accepted' >&2
              exit 1
            fi
          done

  compatibility:
    if: inputs.platform != 'testflight-upload'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require supported Expo dependency versions before signing
        env:
          COMPATIBILITY_RESULT: ${{ needs.source.outputs.compatibility }}
        run: test "$COMPATIBILITY_RESULT" = success

  security:
    if: inputs.platform != 'testflight-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit locked dependencies (hard gate for signing)
        env:
          BC_INTERNAL_SECURITY_EXCEPTION: ${{ ((inputs.platform == 'android' && inputs.android_signing == 'upload-key') || (inputs.platform == 'ios' && inputs.ios_signing == 'testflight')) && '20261118-picomatch-internal' || '' }}
          BC_INTERNAL_SECURITY_PLATFORM: ${{ inputs.platform == 'ios' && 'ios' || 'android' }}
        run: |
          python3 scripts/internal-build/security_gate.py audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: build/security/*.json
          if-no-files-found: error
          retention-days: 7

  testflight-upload:
    if: inputs.platform == 'testflight-upload'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testflight-upload.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_sha: ${{ inputs.source_sha }}
      artifact_id: ${{ inputs.artifact_id }}
      ipa_sha256: ${{ inputs.ipa_sha256 }}
      confirm_internal_only: ${{ inputs.confirm_internal_only }}

  android:
    # Unsigned diagnostics may compile with a FAILED audit, but signing cannot.
    if: >-
      always() && !cancelled() && needs.source.result == 'success' &&
      (inputs.platform == 'both' || inputs.platform == 'android') &&
      (inputs.android_signing != 'upload-key' ||
      (needs.security.result == 'success' && needs.compatibility.result == 'success'))
    needs: [source, security, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: mobile-internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check signing prerequisites without printing credentials
        if: inputs.android_signing == 'upload-key'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: python3 scripts/internal-build/validate.py signing-prerequisites
      - run: npm ci
      - name: Generate native project with explicit signing policy
        env:
          BC_ANDROID_SIGNING: ${{ inputs.android_signing || 'unsigned' }}
        run: |
          npx --no-install expo prebuild --platform android --no-install
          python3 scripts/internal-build/validate.py prepare-android
      - name: Compile Release AAB (not APK/debug; no upload)
        working-directory: android
        env:
          BC_ANDROID_SIGNING: ${{ inputs.android_signing || 'unsigned' }}
          ANDROID_KEYSTORE_BASE64: ${{ inputs.android_signing == 'upload-key' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.android_signing == 'upload-key' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.android_signing == 'upload-key' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.android_signing == 'upload-key' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          python3 ../scripts/internal-build/validate.py install-key
          ./gradlew :app:verifyInternalRelease :app:bundleRelease --no-daemon --max-workers=2
      - name: Verify and label artifact
        env:
          BC_ANDROID_SIGNING: ${{ inputs.android_signing || 'unsigned' }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          BC_SECURITY_AUDIT: ${{ needs.security.result }}
          BC_EXPO_COMPATIBILITY: ${{ needs.compatibility.result }}
        run: |
          python3 scripts/internal-build/security_gate.py runtime android/app/build/intermediates/sourcemaps/react/release/index.android.bundle.packager.map
          python3 scripts/internal-build/validate.py android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ inputs.android_signing || 'unsigned' }}-INTERNAL-ONLY-${{ github.sha }}-${{ github.run_attempt }}
          path: build/internal-artifacts/android/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary upload key
        if: always()
        run: python3 scripts/internal-build/validate.py remove-key

  ios:
    # Default unsigned diagnostics; the signed lane below requires all gates.
    if: >-
      always() && !cancelled() && needs.source.result == 'success' &&
      (inputs.platform == 'both' || inputs.platform == 'ios') && inputs.ios_signing != 'testflight'
    needs: [source, security, compatibility]
    # Map even API-supplied input to an allowlisted hosted runner, never self-hosted.
    runs-on: ${{ inputs.ios_runner == 'macos-26' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - name: Generate native project and install Pods on hosted macOS only
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Archive unsigned iPhoneOS Release (not simulator/debug)
        run: |
          xcodebuild -workspace ios/BharatCode.xcworkspace -scheme BharatCode \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/BharatCode-UNSIGNED.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/bharatcode-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO archive
      - name: Verify and label archive (no IPA export)
        env:
          BC_SECURITY_AUDIT: ${{ needs.security.result }}
          BC_EXPO_COMPATIBILITY: ${{ needs.compatibility.result }}
        run: python3 scripts/internal-build/validate.py ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-UNSIGNED-NOT-UPLOADABLE-${{ github.sha }}-${{ github.run_attempt }}
          path: build/internal-artifacts/ios/*
          if-no-files-found: error
          retention-days: 7

  ios-signed:
    if: >-
      !cancelled() && inputs.platform == 'ios' && inputs.ios_signing == 'testflight' &&
      needs.source.result == 'success' && needs.security.result == 'success' && needs.compatibility.result == 'success'
    needs: [source, security, compatibility]
    runs-on: ${{ inputs.ios_runner == 'macos-26' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 90
    environment: mobile-internal-ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_APP_ID_PREFIX: ${{ vars.IOS_APP_ID_PREFIX }}
      IOS_PROVISION_PROFILE_UUID: ${{ vars.IOS_PROVISION_PROFILE_UUID }}
      IOS_DISTRIBUTION_CERT_SHA256: ${{ vars.IOS_DISTRIBUTION_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check and import approved signing material (no credential creation)
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 scripts/internal-build/ios_signing.py install
      - run: npm ci
      - name: Generate iOS project and scope manual signing to app target
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          python3 scripts/internal-build/ios_signing.py prepare-project
          cd ios
          pod install
      - name: Verify effective Release signing settings before compiling
        run: python3 scripts/internal-build/ios_signing.py build-settings
      - name: Archive signed iPhoneOS Release with actual native source map
        run: |
          mkdir -p build/ios
          xcodebuild -workspace ios/BharatCode.xcworkspace -scheme BharatCode \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/BharatCode-TESTFLIGHT.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/bharatcode-derived-data" \
            SOURCEMAP_FILE="$PWD/build/ios/main.jsbundle.map" \
            COMPILER_INDEX_STORE_ENABLE=NO archive
      - name: Require runtime exclusion again on the actual native iOS bundle map
        run: python3 scripts/internal-build/security_gate.py runtime-ios build/ios/main.jsbundle.map
      - name: Verify signed archive before export
        run: python3 scripts/internal-build/ios_signing.py verify-archive
      - name: Export IPA for TestFlight INTERNAL ONLY (no upload)
        run: |
          xcodebuild -exportArchive -archivePath "$PWD/build/BharatCode-TESTFLIGHT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/bharatcode-ios-signing/ExportOptions.plist" \
            -exportPath "$PWD/build/ios-export"
      - name: Verify exported IPA and label candidate
        env:
          BC_SECURITY_AUDIT: ${{ needs.security.result }}
          BC_EXPO_COMPATIBILITY: ${{ needs.compatibility.result }}
        run: python3 scripts/internal-build/ios_signing.py verify-export
      - name: Remove temporary signing material and restore keychain search list
        if: always()
        run: python3 scripts/internal-build/ios_signing.py cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-TESTFLIGHT-INTERNAL-CANDIDATE-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/internal-artifacts/ios/BharatCode-TESTFLIGHT-INTERNAL-CANDIDATE.ipa
            build/internal-artifacts/ios/build-metadata.json
            build/internal-artifacts/ios/runtime-exclusion.json
            build/internal-artifacts/ios/SHA256SUMS
            build/internal-artifacts/ios/READ-ME-FIRST.txt
          if-no-files-found: error
          retention-days: 7
