name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-connector/package-lock.json
      - run: npm ci
        working-directory: desktop-connector
      - run: npm test
        working-directory: desktop-connector
      - run: python3 -m unittest discover -s desktop-integration/linux-host-browser -p 'test_*.py'
